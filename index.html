<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐸 咕呱日记</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', '幼圆', 'Yuanti SC', cursive, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #fef9e4 0%, #ffe9d6 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 18px 12px 30px;
    }

    .app-container {
      max-width: 460px;
      width: 100%;
      background-color: #fffdf8;
      border-radius: 48px 48px 40px 40px;
      box-shadow: 0 20px 30px rgba(255, 140, 100, 0.15),
                  0 6px 12px rgba(255, 180, 120, 0.2),
                  inset 0 -2px 0 #ffe6d5;
      padding: 24px 16px 28px;
      border: 4px solid #ffe1c6;
      position: relative;
    }

    .app-container::before {
      content: "🐸";
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 42px;
      filter: drop-shadow(0 6px 6px rgba(255, 160, 100, 0.3));
      animation: bounce 2s infinite ease-in-out;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-6px); }
    }

    .title {
      text-align: center;
      margin: 8px 0 6px;
      font-size: 28px;
      font-weight: 700;
      color: #af6e4b;
      text-shadow: 3px 3px 0 #ffdbbf, 0 2px 10px rgba(255, 200, 150, 0.8);
      letter-spacing: 1px;
    }

    /* ========== 视图切换 ========== */
    .view-switch {
      display: flex;
      justify-content: center;
      gap: 0;
      margin: 4px 0 12px;
      background: #fff2e4;
      border-radius: 40px;
      padding: 4px;
      border: 2px solid #ffe0c4;
      box-shadow: inset 0 2px 4px #ffe6d1;
    }

    .view-switch-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 36px;
      padding: 9px 10px;
      font-size: 15px;
      font-weight: 700;
      color: #b08663;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .view-switch-btn.active {
      background: #ffb882;
      color: #5f2f12;
      box-shadow: 0 3px 0 #d3844b;
    }

    .view-switch-btn:active {
      transform: translateY(1px);
    }

    /* ========== 宠物蛙选择栏 ========== */
    .pet-selector {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 6px 0 10px;
      overflow-x: auto;
      padding: 4px 2px 8px;
      scrollbar-width: none;
    }
    .pet-selector::-webkit-scrollbar { display: none; }

    .pet-tab {
      background: #fff8f0;
      border: 2px solid #fde0cc;
      border-radius: 40px;
      padding: 8px 16px 8px 10px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 15px;
      font-weight: 700;
      color: #8a6248;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.1s;
      box-shadow: 0 3px 0 #f0d5c0;
      flex-shrink: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .pet-tab:active { transform: translateY(2px); box-shadow: 0 1px 0 #f0d5c0; }

    .pet-tab.active {
      background: #ffdbb5;
      border-color: #f0a86c;
      box-shadow: 0 3px 0 #d49c69;
      color: #8a4a1e;
      transform: translateY(-1px);
    }

    .pet-icon-wrap {
      position: relative;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .deco-overlay {
      position: absolute;
      font-size: 11px;
      line-height: 1;
      pointer-events: none;
    }

    .deco-bow-top {
      top: -3px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      filter: drop-shadow(0 1px 1px rgba(200,80,120,0.3));
    }

    .deco-bow-bottom {
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      filter: drop-shadow(0 1px 1px rgba(100,100,200,0.3));
    }

    .deco-tophat {
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 15px;
      filter: drop-shadow(0 2px 2px rgba(60,40,30,0.35));
    }

    .deco-spot {
      font-size: 8px;
      top: 8px;
      right: 1px;
      opacity: 0.9;
    }

    .deco-stripe {
      font-size: 10px;
      bottom: 1px;
      left: 1px;
      opacity: 0.8;
    }

    .pet-tab .pet-name {
      max-width: 70px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pet-tab .edit-icon {
      font-size: 11px;
      background: #fff0e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      border: 1px solid #f5c9a8;
      cursor: pointer;
      transition: all 0.1s;
      flex-shrink: 0;
      color: #b07a56;
      font-weight: bold;
    }

    .pet-tab .edit-icon:hover { background: #ffe0c4; }
    .pet-tab.active .edit-icon { background: #ffeacb; border-color: #e0a87a; }

    .pet-tab .delete-icon {
      font-size: 11px;
      background: #fff0e0;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 2px;
      border: 1px solid #f5c9a8;
      cursor: pointer;
      transition: all 0.1s;
      flex-shrink: 0;
      color: #b07a56;
      line-height: 1;
    }

    .pet-tab .delete-icon:hover { background: #ffd4d4; border-color: #e88; }
    .pet-tab.active .delete-icon { background: #ffeacb; border-color: #e0a87a; }

    .add-pet-btn {
      background: #e8f0e0;
      border: 2px dashed #a8c090;
      border-radius: 40px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 700;
      color: #6a8a50;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      box-shadow: 0 3px 0 #c8d8b8;
      transition: all 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .add-pet-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #c8d8b8; }

    /* ========== 月份切换栏 ========== */
    .month-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffe9d4;
      border-radius: 40px;
      padding: 8px 12px;
      margin: 4px 0 16px;
      border: 2px dashed #f7b98b;
      box-shadow: 0 3px 0 #e6b386;
    }

    .month-nav .nav-btn {
      background: #ffffffcc;
      border: none;
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 20px;
      color: #af6e4b;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #dba87e;
      transition: all 0.1s;
      line-height: 1;
      user-select: none;
    }

    .month-nav .nav-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #dba87e; }

    .month-nav .current-month {
      font-size: 20px;
      font-weight: 800;
      color: #865e41;
      letter-spacing: 1px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 700;
      color: #b08663;
      font-size: 13px;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      background: #fff8f0;
      border-radius: 24px;
      padding: 10px 4px;
      border: 2px solid #ffe0c4;
      box-shadow: inset 0 0 0 2px #fff6ec, 0 6px 0 #eccbb4;
      margin-bottom: 16px;
    }

    .day-cell {
      aspect-ratio: 1 / 1;
      background: #ffffff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 4px 2px 2px;
      font-size: 12px;
      font-weight: 600;
      color: #7a5a42;
      border: 1.5px solid #fde0cc;
      box-shadow: 0 3px 0 #f0d5c0;
      cursor: pointer;
      transition: all 0.05s;
      position: relative;
      overflow: hidden;
      line-height: 1.2;
    }

    .day-cell:active { transform: translateY(2px); box-shadow: 0 1px 0 #f0d5c0; }

    .day-cell.empty {
      background: #fff6ec;
      border-color: #ffe8d9;
      box-shadow: none;
      color: #dbb9a0;
      cursor: default;
      pointer-events: none;
    }

    .day-cell.empty:active { transform: none; box-shadow: none; }

    .day-cell.today {
      border: 2.5px solid #f5a05e;
      background: #fff3e6;
      box-shadow: 0 0 0 2px #ffe0b0, 0 4px 0 #e6ac7a;
    }

    .day-number {
      font-size: 15px;
      font-weight: 700;
      color: #6b4e37;
      margin-bottom: 2px;
    }

    .icon-container {
      display: flex;
      flex-wrap: wrap;
      gap: 2px 3px;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0 2px;
    }

    .mini-icon {
      font-size: 13px;
      line-height: 1;
      filter: drop-shadow(0 1px 1px rgba(255, 180, 120, 0.4));
    }

    .overview-frog-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 12px;
      height: 12px;
      font-size: 11px;
      border-radius: 50%;
      background: #ffe9d4;
      border: 1px solid #f7c9a8;
      line-height: 1;
    }

    .overview-badge {
      font-size: 9px;
      font-weight: 800;
      color: #b45f2e;
      background: #ffe0c0;
      border-radius: 20px;
      padding: 0 4px;
      line-height: 13px;
      border: 1px solid #f7c9a8;
    }

    .day-cell.selected-day {
      outline: 3px solid #ffb882;
      outline-offset: 1px;
      background: #ffeedb;
    }

    .detail-panel {
      background: #fff2e4;
      border-radius: 28px;
      padding: 14px 12px 12px;
      margin: 10px 0 12px;
      border: 2px solid #ffe0c4;
      box-shadow: inset 0 2px 8px #ffe6d1, 0 5px 0 #eccbb4;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 6px;
    }

    .detail-header .detail-date {
      font-size: 17px;
      font-weight: 700;
      color: #a4714b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .detail-header .edit-hint {
      font-size: 12px;
      color: #c2936e;
      background: #fff0e0;
      padding: 3px 10px;
      border-radius: 30px;
      border: 1px dashed #f7b98b;
    }

    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-bottom: 8px;
    }

    .quick-btn {
      background: #ffffffd9;
      border: 2px solid #fad1b0;
      border-radius: 40px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      color: #865e41;
      box-shadow: 0 3px 0 #eac6ab;
      transition: all 0.1s;
      cursor: pointer;
      user-select: none;
      flex: 1 0 auto;
      justify-content: center;
      min-width: 75px;
    }

    .quick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #eac6ab; }

    .quick-btn.active {
      background: #ffdbb5;
      border-color: #f0a86c;
      box-shadow: 0 2px 0 #d49c69;
      color: #9a4d1a;
    }

    .note-area {
      background: #fff9f0;
      border-radius: 40px;
      padding: 8px 16px;
      margin: 10px 0 6px;
      border: 2px dashed #fbcba4;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .note-area input {
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      flex: 1;
      padding: 8px 0;
      color: #694d39;
      font-weight: 500;
    }

    .note-area input::placeholder { color: #dbb9a0; font-weight: 400; }
    .note-area span { font-size: 22px; }

    .save-btn {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 14px 18px;
      width: 100%;
      font-size: 20px;
      font-weight: 800;
      color: #5f2f12;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 0 #d3844b, 0 6px 16px #fcc49e;
      transition: all 0.1s;
      cursor: pointer;
      letter-spacing: 2px;
      border: 2px solid #ffeacb;
      margin-top: 6px;
    }

    .save-btn:active { transform: translateY(5px); box-shadow: 0 3px 0 #d3844b, 0 6px 16px #fcc49e; }

    .footer-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    .clear-history {
      background: #ffe1c6;
      border: none;
      border-radius: 30px;
      padding: 6px 18px;
      font-size: 13px;
      color: #aa7048;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 3px 0 #dba87e;
      transition: all 0.1s;
    }

    .clear-history:active { transform: translateY(3px); box-shadow: 0 1px 0 #dba87e; }

    .overview-panel {
      background: #fff2e4;
      border-radius: 28px;
      padding: 14px 12px 12px;
      margin: 10px 0 12px;
      border: 2px solid #ffe0c4;
      box-shadow: inset 0 2px 8px #ffe6d1, 0 5px 0 #eccbb4;
      display: none;
    }

    .overview-panel.visible {
      display: block;
    }

    .overview-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 0 6px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .overview-header .overview-date {
      font-size: 17px;
      font-weight: 700;
      color: #a4714b;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .overview-header .overview-hint {
      font-size: 12px;
      color: #c2936e;
      background: #fff0e0;
      padding: 3px 10px;
      border-radius: 30px;
      border: 1px dashed #f7b98b;
    }

    .overview-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 340px;
      overflow-y: auto;
      padding: 2px;
    }

    .overview-card {
      background: #fffdf8;
      border-radius: 20px;
      padding: 10px 12px;
      border: 2px solid #ffe4cc;
      box-shadow: 0 3px 0 #f0d5c0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: all 0.1s;
    }

    .overview-card.current-pet-highlight {
      border-color: #f5a05e;
      background: #fff8ec;
      box-shadow: 0 3px 0 #e6ac7a, 0 0 0 2px #ffe0b0;
    }

    .overview-card-avatar {
      position: relative;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex-shrink: 0;
      background: #fff3e6;
      border-radius: 50%;
      border: 2px solid #ffe0c4;
    }

    .overview-card-avatar .deco-overlay { font-size: 15px; }
    .overview-card-avatar .deco-bow-top { top: -4px; font-size: 17px; }
    .overview-card-avatar .deco-bow-bottom { bottom: -1px; font-size: 15px; }
    .overview-card-avatar .deco-tophat { top: -10px; font-size: 20px; }
    .overview-card-avatar .deco-spot { font-size: 11px; top: 11px; right: 2px; }
    .overview-card-avatar .deco-stripe { font-size: 13px; bottom: 3px; left: 1px; }

    .overview-card-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .overview-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .overview-card-name {
      font-size: 15px;
      font-weight: 800;
      color: #8a4a1e;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .overview-card-name .current-tag {
      font-size: 10px;
      font-weight: 700;
      background: #ffdbb5;
      color: #9a4d1a;
      padding: 1px 7px;
      border-radius: 20px;
      border: 1px solid #f0a86c;
      flex-shrink: 0;
    }

    .overview-card-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .overview-item-chip {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      background: #fff2e4;
      border-radius: 30px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #865e41;
      border: 1px solid #ffe0c4;
      white-space: nowrap;
    }

    .overview-no-record {
      font-size: 12px;
      color: #d0b09a;
      font-style: italic;
      background: #fff9f0;
      border-radius: 20px;
      padding: 5px 10px;
      border: 1px dashed #f7dcc4;
      display: inline-block;
    }

    .overview-card-note {
      font-size: 12px;
      color: #a88264;
      background: #fff9f0;
      border-radius: 12px;
      padding: 5px 10px;
      border-left: 3px solid #f7c9a8;
      word-break: break-all;
      line-height: 1.4;
    }

    .overview-card-note::before {
      content: "📝 ";
    }

    .icon-picker-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 235, 215, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.2s;
    }

    .icon-picker-modal {
      background: #fffdf8;
      border-radius: 48px;
      padding: 24px 20px 20px;
      max-width: 420px;
      width: 90%;
      border: 4px solid #ffe1c6;
      box-shadow: 0 20px 30px rgba(255, 140, 100, 0.25);
      text-align: center;
    }

    .icon-picker-modal h3 {
      color: #af6e4b;
      font-size: 20px;
      margin-bottom: 6px;
      font-weight: 700;
    }

    .icon-picker-sub {
      font-size: 13px;
      color: #c2936e;
      margin-bottom: 16px;
    }

    .pet-name-edit {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff6ec;
      border: 2px dashed #fbcba4;
      border-radius: 40px;
      padding: 6px 16px;
      margin-bottom: 16px;
    }

    .pet-name-edit-label {
      font-size: 14px;
      font-weight: 700;
      color: #b08663;
      white-space: nowrap;
    }

    .pet-name-edit input {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      font-size: 16px;
      font-weight: 600;
      color: #694d39;
      padding: 8px 0;
      font-family: inherit;
    }

    .pet-name-edit input::placeholder { color: #dbb9a0; font-weight: 400; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
      max-height: 340px;
      overflow-y: auto;
      padding: 4px;
    }

    .icon-option {
      background: #fff6ec;
      border-radius: 20px;
      padding: 10px 4px 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.1s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 3px 0 #f0d5c0;
    }

    .icon-option:active { transform: translateY(2px); box-shadow: 0 1px 0 #f0d5c0; }
    .icon-option.selected { background: #ffdbb5; border-color: #f0a86c; box-shadow: 0 3px 0 #d49c69; }

    .icon-option .icon-wrap {
      position: relative;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
    }

    .icon-option .icon-label {
      font-size: 11px;
      color: #a4714b;
      font-weight: 600;
      white-space: nowrap;
    }

    .icon-option .deco-overlay { font-size: 16px; }
    .icon-option .deco-bow-top { top: -6px; font-size: 18px; }
    .icon-option .deco-bow-bottom { bottom: -2px; font-size: 16px; }
    .icon-option .deco-tophat { top: -12px; font-size: 22px; }
    .icon-option .deco-spot { font-size: 12px; top: 12px; right: 4px; }
    .icon-option .deco-stripe { font-size: 14px; bottom: 4px; left: 2px; }

    .icon-picker-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .icon-picker-actions button {
      background: #ffb882;
      border: none;
      border-radius: 60px;
      padding: 12px 24px;
      font-size: 17px;
      font-weight: 700;
      color: #5f2f12;
      cursor: pointer;
      box-shadow: 0 5px 0 #d3844b;
      transition: all 0.1s;
      border: 2px solid #ffeacb;
      flex: 1;
    }

    .icon-picker-actions button:active { transform: translateY(4px); box-shadow: 0 1px 0 #d3844b; }

    .icon-picker-actions .cancel-btn {
      background: #f5e6d9;
      color: #946b4f;
      box-shadow: 0 5px 0 #d4bcab;
      border-color: #f0dccb;
    }

    .icon-picker-actions .cancel-btn:active { box-shadow: 0 1px 0 #d4bcab; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    @media (max-width: 380px) {
      .app-container { padding: 20px 10px 22px; }
      .quick-btn { font-size: 13px; padding: 6px 8px; min-width: 62px; }
      .mini-icon { font-size: 11px; }
      .day-number { font-size: 13px; }
      .calendar-grid { gap: 3px; padding: 6px 2px; }
      .pet-tab { padding: 6px 10px 6px 8px; font-size: 13px; }
      .title { font-size: 24px; }
      .icon-grid { grid-template-columns: repeat(3, 1fr); }
      .view-switch-btn { font-size: 13px; padding: 7px 6px; }
      .overview-card-avatar { width: 32px; height: 32px; font-size: 25px; }
      .overview-card-avatar .deco-tophat { font-size: 17px; top: -8px; }
      .overview-item-chip { font-size: 11px; padding: 2px 6px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="title">🐸 咕呱日记</div>

    <!-- ===== 视图切换 ===== -->
    <div class="view-switch">
      <button class="view-switch-btn active" id="viewCheckinBtn">📋 打卡视图</button>
      <button class="view-switch-btn" id="viewOverviewBtn">👀 全览视图</button>
    </div>

    <!-- 宠物蛙选择栏（打卡视图下显示） -->
    <div class="pet-selector" id="petSelector"></div>

    <div class="month-nav">
      <button class="nav-btn" id="prevMonth">◀</button>
      <span class="current-month" id="monthDisplay">2025年3月</span>
      <button class="nav-btn" id="nextMonth">▶</button>
    </div>

    <div class="weekdays">
      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>

    <div class="calendar-grid" id="calendarGrid"></div>

    <!-- ===== 打卡视图：单蛙详情面板 ===== -->
    <div class="detail-panel" id="detailPanel">
      <div class="detail-header">
        <span class="detail-date" id="detailDate">📅 3月21日</span>
        <span class="edit-hint">点击下方按钮打卡</span>
      </div>
      <div class="quick-actions" id="quickActions"></div>
      <div class="note-area">
        <span>✏️</span>
        <input type="text" id="noteInput" placeholder="给这一天加个备注...">
      </div>
    </div>

    <!-- ===== 全览视图：所有蛙蛙状态面板 ===== -->
    <div class="overview-panel" id="overviewPanel">
      <div class="overview-header">
        <span class="overview-date" id="overviewDate">📅 3月21日 · 全览</span>
        <span class="overview-hint">点击日期查看所有蛙蛙</span>
      </div>
      <div class="overview-list" id="overviewList"></div>
    </div>

    <!-- 清空按钮（打卡视图下显示） -->
    <button class="save-btn" id="saveBtn"><span>🗑️</span> 清空当前蛙全部记录</button>
  </div>

  <!-- 图标选择弹窗 -->
  <div class="icon-picker-overlay" id="iconPickerOverlay" style="display: none;">
    <div class="icon-picker-modal">
      <h3>✏️ 编辑蛙蛙</h3>
      <div class="icon-picker-sub">改个名字，再挑个喜欢的图标～</div>
      <div class="pet-name-edit">
        <span class="pet-name-edit-label">🐸 名字</span>
        <input type="text" id="petNameInput" maxlength="12" placeholder="给蛙蛙起个名字">
      </div>
      <div class="icon-grid" id="iconGrid"></div>
      <div class="icon-picker-actions">
        <button class="cancel-btn" id="cancelIconPick">取消</button>
        <button id="confirmIconPick">确定</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const allItems = [
        { key: 'feed', emoji: '🍗', label: '喂食' },
        { key: 'water', emoji: '💧', label: '换水' },
        { key: 'poop', emoji: '💩', label: '排便' },
        { key: 'bath', emoji: '🛁', label: '泡澡' },
        { key: 'enteritis', emoji: '😷', label: '肠炎' },
        { key: 'encephalitis', emoji: '🧠', label: '脑炎' },
        { key: 'blinding', emoji: '👁️', label: '蒙眼' },
        { key: 'medicine', emoji: '💊', label: '用药' }
      ];

      const quickItemKeys = ['feed', 'water', 'poop', 'bath', 'enteritis', 'encephalitis', 'blinding', 'medicine'];

      const iconLibrary = [
        { id: 'frog_basic', name: '普通蛙', base: '🐸', decos: [] },
        { id: 'frog_bowtie_blue', name: '蓝领结公蛙', base: '🐸', decos: [{ type: 'bow-bottom', emoji: '🔵', cls: 'deco-bow-bottom' }] },
        { id: 'frog_bowtie_red', name: '红领结公蛙', base: '🐸', decos: [{ type: 'bow-bottom', emoji: '🔴', cls: 'deco-bow-bottom' }] },
        { id: 'frog_bowtie_gold', name: '金领结公蛙', base: '🐸', decos: [{ type: 'bow-bottom', emoji: '⭐', cls: 'deco-bow-bottom' }] },
        { id: 'frog_bow_pink', name: '粉蝴蝶母蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '🎀', cls: 'deco-bow-top' }] },
        { id: 'frog_bow_purple', name: '紫蝴蝶母蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '💜', cls: 'deco-bow-top' }] },
        { id: 'frog_bow_heart', name: '爱心母蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '❤️', cls: 'deco-bow-top' }] },
        { id: 'frog_tophat', name: '礼帽蛙', base: '🐸', decos: [{ type: 'tophat', emoji: '🎩', cls: 'deco-tophat' }] },
        { id: 'frog_spot_green', name: '斑点蛙', base: '🐸', decos: [{ type: 'spot', emoji: '🟢', cls: 'deco-spot' }] },
        { id: 'frog_spot_brown', name: '棕斑蛙', base: '🐸', decos: [{ type: 'spot', emoji: '🟤', cls: 'deco-spot' }] },
        { id: 'frog_stripe_yellow', name: '黄纹蛙', base: '🐸', decos: [{ type: 'stripe', emoji: '🟡', cls: 'deco-stripe' }] },
        { id: 'frog_stripe_orange', name: '橙纹蛙', base: '🐸', decos: [{ type: 'stripe', emoji: '🟠', cls: 'deco-stripe' }] },
        { id: 'frog_blue', name: '蓝蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '🔷', cls: 'deco-bow-top' }] },
        { id: 'frog_green_gem', name: '翠绿蛙', base: '🐸', decos: [{ type: 'spot', emoji: '💚', cls: 'deco-spot' }] },
        { id: 'frog_purple_gem', name: '紫晶蛙', base: '🐸', decos: [{ type: 'spot', emoji: '💜', cls: 'deco-spot' }] },
        { id: 'frog_gold', name: '黄金蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '🌟', cls: 'deco-bow-top' }] },
        { id: 'frog_crown', name: '小王子蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '👑', cls: 'deco-bow-top' }] },
        { id: 'frog_flower', name: '花花蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '🌸', cls: 'deco-bow-top' }] },
        { id: 'frog_clover', name: '幸运蛙', base: '🐸', decos: [{ type: 'spot', emoji: '🍀', cls: 'deco-spot' }] },
        { id: 'frog_rainbow', name: '彩虹蛙', base: '🐸', decos: [{ type: 'stripe', emoji: '🌈', cls: 'deco-stripe' }] },
        { id: 'frog_hearts', name: '甜心蛙', base: '🐸', decos: [{ type: 'spot', emoji: '💕', cls: 'deco-spot' }] },
        { id: 'frog_star', name: '星星蛙', base: '🐸', decos: [{ type: 'bow-top', emoji: '⭐', cls: 'deco-bow-top' }] },
        { id: 'toad', name: '蟾蜍', base: '🐸', decos: [{ type: 'spot', emoji: '🟤', cls: 'deco-spot' }] },
        { id: 'tree_frog', name: '树蛙', base: '🐸', decos: [{ type: 'stripe', emoji: '🟢', cls: 'deco-stripe' }] },
        { id: 'dart_frog', name: '箭毒蛙', base: '🐸', decos: [{ type: 'spot', emoji: '🔴', cls: 'deco-spot' }] },
      ];

      function getIconDef(id) {
        return iconLibrary.find(i => i.id === id) || iconLibrary[0];
      }

      function renderIconHTML(iconId) {
        const def = getIconDef(iconId);
        let html = `<span class="frog-base">${def.base}</span>`;
        def.decos.forEach(d => {
          html += `<span class="deco-overlay ${d.cls}">${d.emoji}</span>`;
        });
        return html;
      }

      let pets = [
        { id: 'frog_1', name: '小绿', iconId: 'frog_basic' },
        { id: 'frog_2', name: '小黄', iconId: 'frog_bow_pink' }
      ];

      let currentPetId = 'frog_1';
      let records = {};
      let selectedDateStr = null;
      let currentYear = new Date().getFullYear();
      let currentMonth = new Date().getMonth();
      let currentView = 'checkin';

      let pickingPetId = null;
      let tempSelectedIconId = null;

      const petSelector = document.getElementById('petSelector');
      const calendarGrid = document.getElementById('calendarGrid');
      const monthDisplay = document.getElementById('monthDisplay');
      const prevMonthBtn = document.getElementById('prevMonth');
      const nextMonthBtn = document.getElementById('nextMonth');
      const detailDateSpan = document.getElementById('detailDate');
      const quickActionsDiv = document.getElementById('quickActions');
      const noteInput = document.getElementById('noteInput');
      const saveBtn = document.getElementById('saveBtn');
      const iconPickerOverlay = document.getElementById('iconPickerOverlay');
      const petNameInput = document.getElementById('petNameInput');
      const iconGrid = document.getElementById('iconGrid');
      const cancelIconPick = document.getElementById('cancelIconPick');
      const confirmIconPick = document.getElementById('confirmIconPick');
      const detailPanel = document.getElementById('detailPanel');
      const overviewPanel = document.getElementById('overviewPanel');
      const overviewDateSpan = document.getElementById('overviewDate');
      const overviewList = document.getElementById('overviewList');
      const viewCheckinBtn = document.getElementById('viewCheckinBtn');
      const viewOverviewBtn = document.getElementById('viewOverviewBtn');

      function formatDateStr(year, month, day) {
        return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      function getTodayStr() {
        const d = new Date();
        return formatDateStr(d.getFullYear(), d.getMonth(), d.getDate());
      }

      function parseDateStr(str) {
        const parts = str.split('-');
        return { year: parseInt(parts[0], 10), month: parseInt(parts[1], 10) - 1, day: parseInt(parts[2], 10) };
      }

      function getFirstDayOfMonth(year, month) {
        let day = new Date(year, month, 1).getDay();
        return (day === 0) ? 6 : day - 1;
      }

      function getDaysInMonth(year, month) {
        return new Date(year, month + 1, 0).getDate();
      }

      function saveToStorage() {
        try {
          localStorage.setItem('frogMultiPetRecords_v3', JSON.stringify(records));
          localStorage.setItem('frogMultiPetList_v3', JSON.stringify(pets));
          localStorage.setItem('frogCurrentPetId_v3', currentPetId);
        } catch(e) {}
      }

      function loadFromStorage() {
        try {
          const storedRecords = localStorage.getItem('frogMultiPetRecords_v3');
          if (storedRecords) records = JSON.parse(storedRecords);
          const storedPets = localStorage.getItem('frogMultiPetList_v3');
          if (storedPets) {
            pets = JSON.parse(storedPets);
            if (!pets.length) {
              pets = [{ id: 'frog_1', name: '小绿', iconId: 'frog_basic' }];
            }
            pets = pets.map(p => {
              if (!p.iconId) p.iconId = 'frog_basic';
              return p;
            });
          }
          const storedCurrent = localStorage.getItem('frogCurrentPetId_v3');
          if (storedCurrent && pets.some(p => p.id === storedCurrent)) {
            currentPetId = storedCurrent;
          } else if (pets.length) {
            currentPetId = pets[0].id;
          }
          pets.forEach(p => {
            if (!records[p.id]) records[p.id] = {};
          });
        } catch(e) {
          pets = [{ id: 'frog_1', name: '小绿', iconId: 'frog_basic' }];
          currentPetId = pets[0].id;
          records = { 'frog_1': {} };
        }
        if (Object.keys(records).length === 0) {
          pets.forEach(p => { records[p.id] = {}; });
        }
      }

      function showToast(msg) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.style.position = 'fixed';
        toast.style.bottom = '30px';
        toast.style.left = '50%';
        toast.style.transform = 'translateX(-50%)';
        toast.style.background = '#ffb882';
        toast.style.color = '#4f2a10';
        toast.style.padding = '12px 28px';
        toast.style.borderRadius = '60px';
        toast.style.fontWeight = 'bold';
        toast.style.boxShadow = '0 6px 0 #c9763c';
        toast.style.zIndex = '999';
        toast.style.border = '2px solid #ffeacb';
        toast.style.fontSize = '18px';
        toast.style.whiteSpace = 'nowrap';
        document.body.appendChild(toast);
        setTimeout(() => {
          toast.style.transition = 'opacity 0.3s';
          toast.style.opacity = '0';
          setTimeout(() => toast.remove(), 300);
        }, 1500);
      }

      function switchView(view) {
        currentView = view;
        if (view === 'checkin') {
          viewCheckinBtn.classList.add('active');
          viewOverviewBtn.classList.remove('active');
          petSelector.style.display = 'flex';
          detailPanel.style.display = 'block';
          overviewPanel.classList.remove('visible');
          saveBtn.style.display = 'flex';
        } else {
          viewOverviewBtn.classList.add('active');
          viewCheckinBtn.classList.remove('active');
          petSelector.style.display = 'none';
          detailPanel.style.display = 'none';
          overviewPanel.classList.add('visible');
          saveBtn.style.display = 'none';
        }
        renderCalendar();
        if (view === 'checkin') {
          renderDetailPanel();
        } else {
          renderOverviewPanel();
        }
      }

      function openIconPicker(petId) {
        pickingPetId = petId;
        const pet = pets.find(p => p.id === petId);
        tempSelectedIconId = pet ? pet.iconId : 'frog_basic';
        petNameInput.value = pet ? pet.name : '';
        renderIconGrid();
        iconPickerOverlay.style.display = 'flex';
        setTimeout(() => petNameInput.focus(), 50);
      }

      function renderIconGrid() {
        iconGrid.innerHTML = '';
        iconLibrary.forEach(iconDef => {
          const div = document.createElement('div');
          div.className = `icon-option ${iconDef.id === tempSelectedIconId ? 'selected' : ''}`;
          div.innerHTML = `
            <div class="icon-wrap">
              ${renderIconHTML(iconDef.id)}
            </div>
            <span class="icon-label">${iconDef.name}</span>
          `;
          div.addEventListener('click', (e) => {
            e.stopPropagation();
            tempSelectedIconId = iconDef.id;
            renderIconGrid();
          });
          iconGrid.appendChild(div);
        });
      }

      function closeIconPicker() {
        iconPickerOverlay.style.display = 'none';
        pickingPetId = null;
        tempSelectedIconId = null;
      }

      function confirmIconPickHandler() {
        if (!pickingPetId || !tempSelectedIconId) return;
        const pet = pets.find(p => p.id === pickingPetId);
        if (pet) {
          const newName = petNameInput.value.trim();
          if (!newName) {
            showToast('名字不能为空哦～');
            petNameInput.focus();
            return;
          }
          pet.name = newName;
          pet.iconId = tempSelectedIconId;
          renderPetSelector();
          saveToStorage();
          showToast('✨ 蛙蛙信息更新啦！');
          if (currentView === 'overview') renderOverviewPanel();
        }
        closeIconPicker();
      }

      petNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') confirmIconPickHandler();
      });

      cancelIconPick.addEventListener('click', closeIconPicker);
      confirmIconPick.addEventListener('click', confirmIconPickHandler);
      iconPickerOverlay.addEventListener('click', (e) => {
        if (e.target === iconPickerOverlay) closeIconPicker();
      });

      function renderPetSelector() {
        petSelector.innerHTML = '';
        pets.forEach(pet => {
          const tab = document.createElement('div');
          tab.className = `pet-tab ${pet.id === currentPetId ? 'active' : ''}`;
          tab.dataset.petId = pet.id;
          tab.innerHTML = `
            <div class="pet-icon-wrap">
              ${renderIconHTML(pet.iconId)}
            </div>
            <span class="pet-name">${pet.name}</span>
            <span class="edit-icon" data-pet-id="${pet.id}" title="点击编辑名字和图标">✎</span>
            <span class="delete-icon" data-pet-id="${pet.id}" title="删除这只蛙">🗑</span>
          `;
          tab.addEventListener('click', (e) => {
            if (e.target.classList.contains('edit-icon')) return;
            e.stopPropagation();
            if (currentPetId === pet.id) return;
            currentPetId = pet.id;
            if (selectedDateStr) {
              const parsed = parseDateStr(selectedDateStr);
              if (parsed.year !== currentYear || parsed.month !== currentMonth) {
                currentYear = parsed.year;
                currentMonth = parsed.month;
              }
            }
            renderAll();
            saveToStorage();
          });
          const editIcon = tab.querySelector('.edit-icon');
          editIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            openIconPicker(pet.id);
          });
          const deleteIcon = tab.querySelector('.delete-icon');
          deleteIcon.addEventListener('click', (e) => {
            e.stopPropagation();
            if (pets.length <= 1) {
              showToast('至少保留一只蛙蛙哦～');
              return;
            }
            if (!confirm(`确定要删除「${pet.name}」吗？\nTA 的所有打卡记录也将一并删除，此操作不可恢复！`)) return;
            pets = pets.filter(p => p.id !== pet.id);
            delete records[pet.id];
            if (currentPetId === pet.id) {
              currentPetId = pets[0].id;
            }
            selectedDateStr = getTodayStr();
            const today = new Date();
            currentYear = today.getFullYear();
            currentMonth = today.getMonth();
            renderAll();
            saveToStorage();
            showToast(`🗑️ 已删除「${pet.name}」`);
          });
          petSelector.appendChild(tab);
        });

        const addBtn = document.createElement('div');
        addBtn.className = 'add-pet-btn';
        addBtn.innerHTML = '＋ 新蛙';
        addBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const name = prompt('🐸 给新蛙起个名字吧：', `蛙蛙${pets.length + 1}`);
          if (name === null) return;
          const trimmed = name.trim();
          if (!trimmed) { showToast('名字不能为空哦～'); return; }
          const newId = 'frog_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
          const randomIcon = iconLibrary[Math.floor(Math.random() * iconLibrary.length)];
          const newPet = { id: newId, name: trimmed, iconId: randomIcon.id };
          pets.push(newPet);
          records[newId] = {};
          currentPetId = newId;
          selectedDateStr = getTodayStr();
          const today = new Date();
          currentYear = today.getFullYear();
          currentMonth = today.getMonth();
          renderAll();
          saveToStorage();
          showToast(`🎉 欢迎 ${trimmed} 加入！`);
        });
        petSelector.appendChild(addBtn);
      }

      function renderCalendar() {
        monthDisplay.textContent = `${currentYear}年${currentMonth + 1}月`;
        calendarGrid.innerHTML = '';

        const firstDayOffset = getFirstDayOfMonth(currentYear, currentMonth);
        const daysInMonth = getDaysInMonth(currentYear, currentMonth);
        const todayStr = getTodayStr();

        for (let i = 0; i < firstDayOffset; i++) {
          const emptyCell = document.createElement('div');
          emptyCell.className = 'day-cell empty';
          calendarGrid.appendChild(emptyCell);
        }

        for (let day = 1; day <= daysInMonth; day++) {
          const dateStr = formatDateStr(currentYear, currentMonth, day);
          const cell = document.createElement('div');
          cell.className = 'day-cell';
          if (dateStr === todayStr) cell.classList.add('today');
          if (dateStr === selectedDateStr) cell.classList.add('selected-day');

          const numberDiv = document.createElement('div');
          numberDiv.className = 'day-number';
          numberDiv.textContent = day;
          cell.appendChild(numberDiv);

          const iconContainer = document.createElement('div');
          iconContainer.className = 'icon-container';

          if (currentView === 'checkin') {
            const currentPetRecords = records[currentPetId] || {};
            const dayRecord = currentPetRecords[dateStr] || {};
            allItems.forEach(item => {
              if (dayRecord[item.key]) {
                const iconSpan = document.createElement('span');
                iconSpan.className = 'mini-icon';
                iconSpan.textContent = item.emoji;
                iconContainer.appendChild(iconSpan);
              }
            });
          } else {
            let frogCount = 0;
            pets.forEach(pet => {
              const petRecord = records[pet.id]?.[dateStr];
              if (petRecord) {
                const hasItems = Object.keys(petRecord).some(k => k !== 'note' && petRecord[k]);
                const hasNote = petRecord.note && petRecord.note.trim() !== '';
                if (hasItems || hasNote) {
                  frogCount++;
                  const dot = document.createElement('span');
                  dot.className = 'overview-frog-dot';
                  dot.innerHTML = renderIconHTML(pet.iconId);
                  dot.style.fontSize = '11px';
                  const decos = dot.querySelectorAll('.deco-overlay');
                  decos.forEach(d => d.style.fontSize = '6px');
                  iconContainer.appendChild(dot);
                }
              }
            });
            if (frogCount > 3) {
              while (iconContainer.children.length > 3) {
                iconContainer.removeChild(iconContainer.lastChild);
              }
              const badge = document.createElement('span');
              badge.className = 'overview-badge';
              badge.textContent = `+${frogCount - 3}`;
              iconContainer.appendChild(badge);
            }
          }

          cell.appendChild(iconContainer);

          cell.addEventListener('click', (e) => {
            e.stopPropagation();
            selectedDateStr = dateStr;
            renderCalendar();
            if (currentView === 'checkin') {
              renderDetailPanel();
            } else {
              renderOverviewPanel();
            }
          });

          calendarGrid.appendChild(cell);
        }

        const totalCells = firstDayOffset + daysInMonth;
        const remainder = totalCells % 7;
        if (remainder !== 0) {
          for (let i = 0; i < 7 - remainder; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.className = 'day-cell empty';
            calendarGrid.appendChild(emptyCell);
          }
        }
      }

      function renderDetailPanel() {
        if (!selectedDateStr) {
          selectedDateStr = getTodayStr();
          const todayParsed = parseDateStr(selectedDateStr);
          if (todayParsed.year !== currentYear || todayParsed.month !== currentMonth) {
            currentYear = todayParsed.year;
            currentMonth = todayParsed.month;
            renderCalendar();
          }
        }

        const parsed = parseDateStr(selectedDateStr);
        detailDateSpan.textContent = `📅 ${parsed.month + 1}月${parsed.day}日`;

        const currentPetRecords = records[currentPetId] || {};
        const dayRecord = currentPetRecords[selectedDateStr] || {};

        quickActionsDiv.innerHTML = '';
        quickItemKeys.forEach(key => {
          const item = allItems.find(i => i.key === key);
          if (!item) return;
          const btn = document.createElement('div');
          btn.className = `quick-btn ${dayRecord[key] ? 'active' : ''}`;
          btn.dataset.key = key;
          btn.innerHTML = `${item.emoji} ${item.label}`;
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!records[currentPetId]) records[currentPetId] = {};
            if (!records[currentPetId][selectedDateStr]) records[currentPetId][selectedDateStr] = {};
            const rec = records[currentPetId][selectedDateStr];
            if (rec[key]) { delete rec[key]; } else { rec[key] = true; }
            const hasAny = Object.keys(rec).some(k => k !== 'note' && rec[k]) || (rec.note && rec.note.trim() !== '');
            if (!hasAny) { delete records[currentPetId][selectedDateStr]; }
            saveToStorage();
            renderDetailPanel();
            renderCalendar();
          });
          quickActionsDiv.appendChild(btn);
        });

        noteInput.value = (records[currentPetId]?.[selectedDateStr]?.note) || '';
        noteInput.oninput = (e) => {
          const val = e.target.value;
          if (!records[currentPetId]) records[currentPetId] = {};
          if (!records[currentPetId][selectedDateStr]) records[currentPetId][selectedDateStr] = {};
          records[currentPetId][selectedDateStr].note = val;
          const rec = records[currentPetId][selectedDateStr];
          const hasAny = Object.keys(rec).some(k => k !== 'note' && rec[k]) || (rec.note && rec.note.trim() !== '');
          if (!hasAny) { delete records[currentPetId][selectedDateStr]; }
        };
      }

      function renderOverviewPanel() {
        if (!selectedDateStr) {
          selectedDateStr = getTodayStr();
          const todayParsed = parseDateStr(selectedDateStr);
          if (todayParsed.year !== currentYear || todayParsed.month !== currentMonth) {
            currentYear = todayParsed.year;
            currentMonth = todayParsed.month;
            renderCalendar();
          }
        }

        const parsed = parseDateStr(selectedDateStr);
        overviewDateSpan.textContent = `📅 ${parsed.month + 1}月${parsed.day}日 · 全览`;

        overviewList.innerHTML = '';

        if (pets.length === 0) {
          overviewList.innerHTML = `<div class="overview-no-record" style="text-align:center;">还没有添加蛙蛙哦～</div>`;
          return;
        }

        pets.forEach(pet => {
          const petRecord = records[pet.id]?.[selectedDateStr] || {};
          const hasItems = Object.keys(petRecord).some(k => k !== 'note' && petRecord[k]);
          const hasNote = petRecord.note && petRecord.note.trim() !== '';
          const isCurrent = pet.id === currentPetId;

          const card = document.createElement('div');
          card.className = `overview-card ${isCurrent ? 'current-pet-highlight' : ''}`;

          const avatarDiv = document.createElement('div');
          avatarDiv.className = 'overview-card-avatar';
          avatarDiv.innerHTML = renderIconHTML(pet.iconId);
          card.appendChild(avatarDiv);

          const infoDiv = document.createElement('div');
          infoDiv.className = 'overview-card-info';

          const topDiv = document.createElement('div');
          topDiv.className = 'overview-card-top';
          const nameDiv = document.createElement('div');
          nameDiv.className = 'overview-card-name';
          nameDiv.innerHTML = `${pet.name} ${isCurrent ? '<span class="current-tag">当前</span>' : ''}`;
          topDiv.appendChild(nameDiv);
          infoDiv.appendChild(topDiv);

          const iconsDiv = document.createElement('div');
          iconsDiv.className = 'overview-card-icons';
          if (hasItems) {
            allItems.forEach(item => {
              if (petRecord[item.key]) {
                const chip = document.createElement('span');
                chip.className = 'overview-item-chip';
                chip.innerHTML = `${item.emoji} ${item.label}`;
                iconsDiv.appendChild(chip);
              }
            });
          } else if (!hasNote) {
            const noRec = document.createElement('span');
            noRec.className = 'overview-no-record';
            noRec.textContent = '🐸 今天还没有记录';
            iconsDiv.appendChild(noRec);
          }
          infoDiv.appendChild(iconsDiv);

          if (hasNote) {
            const noteDiv = document.createElement('div');
            noteDiv.className = 'overview-card-note';
            noteDiv.textContent = petRecord.note;
            infoDiv.appendChild(noteDiv);
          }

          card.appendChild(infoDiv);
          overviewList.appendChild(card);
        });
      }

      function goToPrevMonth() {
        if (currentMonth === 0) { currentYear--; currentMonth = 11; } else { currentMonth--; }
        if (selectedDateStr) {
          const parsed = parseDateStr(selectedDateStr);
          if (parsed.year !== currentYear || parsed.month !== currentMonth) {
            selectedDateStr = formatDateStr(currentYear, currentMonth, 1);
          }
        } else {
          selectedDateStr = formatDateStr(currentYear, currentMonth, 1);
        }
        renderCalendar();
        if (currentView === 'checkin') renderDetailPanel();
        else renderOverviewPanel();
      }

      function goToNextMonth() {
        if (currentMonth === 11) { currentYear++; currentMonth = 0; } else { currentMonth++; }
        if (selectedDateStr) {
          const parsed = parseDateStr(selectedDateStr);
          if (parsed.year !== currentYear || parsed.month !== currentMonth) {
            selectedDateStr = formatDateStr(currentYear, currentMonth, 1);
          }
        } else {
          selectedDateStr = formatDateStr(currentYear, currentMonth, 1);
        }
        renderCalendar();
        if (currentView === 'checkin') renderDetailPanel();
        else renderOverviewPanel();
      }

      function clearAllRecordsForCurrentPet() {
        const petName = pets.find(p => p.id === currentPetId)?.name || '角蛙';
        if (confirm(`确定要清空 ${petName} 的全部打卡记录吗？`)) {
          records[currentPetId] = {};
          saveToStorage();
          renderCalendar();
          if (currentView === 'checkin') renderDetailPanel();
          else renderOverviewPanel();
          showToast(`🧹 ${petName} 的记录已清空`);
        }
      }

      function renderAll() {
        renderPetSelector();
        renderCalendar();
        if (currentView === 'checkin') {
          renderDetailPanel();
        } else {
          renderOverviewPanel();
        }
      }

      function init() {
        loadFromStorage();
        if (!pets.some(p => p.id === currentPetId)) {
          currentPetId = pets[0]?.id || 'frog_1';
        }
        if (!records[currentPetId]) records[currentPetId] = {};

        const today = new Date();
        selectedDateStr = getTodayStr();
        currentYear = today.getFullYear();
        currentMonth = today.getMonth();

        renderAll();

        viewCheckinBtn.addEventListener('click', () => switchView('checkin'));
        viewOverviewBtn.addEventListener('click', () => switchView('overview'));

        prevMonthBtn.addEventListener('click', goToPrevMonth);
        nextMonthBtn.addEventListener('click', goToNextMonth);
        saveBtn.addEventListener('click', clearAllRecordsForCurrentPet);
      }

      init();
    })();
  </script>
</body>
</html>
